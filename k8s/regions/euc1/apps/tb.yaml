apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tb-euc1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://example.com/your-repo.git
    targetRevision: main
    path: k8s/charts/tb
  destination:
    server: https://kubernetes.default.svc
    namespace: trading-bot
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions: ["CreateNamespace=true"]
