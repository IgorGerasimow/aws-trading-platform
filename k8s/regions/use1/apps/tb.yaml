apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: use1-tb
  namespace: argocd
spec:
  project: trading-platform
  source:
    repoURL: https://github.com/example/aws-trading-platform.git
    targetRevision: main
    path: k8s/charts/tb
    helm:
      releaseName: tb
      values: |
        env:
          - name: REGION
            value: use1
  destination:
    server: https://kubernetes.default.svc
    namespace: trading-tb
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
