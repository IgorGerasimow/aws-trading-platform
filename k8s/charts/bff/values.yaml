nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: ghcr.io/example/bff
  tag: v0.1.0

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

secrets:
  nats:
    name: trading-nats
    key: url

networkPolicy:
  ingressNamespace: ""
  ingressApp: "nats-jetstream"
  egressNamespace: ""
