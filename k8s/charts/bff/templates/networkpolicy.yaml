apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bff.fullname" . }}
  labels:
    {{- include "bff.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bff.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | default .Release.Namespace }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.ingressApp | default "nats-jetstream" }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egressNamespace | default .Release.Namespace }}
      ports:
        - port: 4222
          protocol: TCP
