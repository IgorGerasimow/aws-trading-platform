apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "observability-agents.fullname" . }}-prometheus-agent
  labels:
    {{- include "observability-agents.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "pods", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "observability-agents.fullname" . }}-prometheus-agent
  labels:
    {{- include "observability-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "observability-agents.fullname" . }}-prometheus-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "observability-agents.fullname" . }}-prometheus-agent
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "observability-agents.fullname" . }}-promtail
  labels:
    {{- include "observability-agents.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "observability-agents.fullname" . }}-promtail
  labels:
    {{- include "observability-agents.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "observability-agents.fullname" . }}-promtail
subjects:
  - kind: ServiceAccount
    name: {{ include "observability-agents.fullname" . }}-promtail
    namespace: {{ .Release.Namespace }}
