apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rms-core.fullname" . }}
  labels:
    {{- include "rms-core.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rms-core.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | default .Release.Namespace }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egressNamespace | default .Release.Namespace }}
      ports:
        - port: {{ .Values.nats.port }}
          protocol: TCP
