apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: trading-platform
  namespace: argocd
spec:
  description: Trading platform workloads
  sourceRepos:
    - https://github.com/example/aws-trading-platform.git
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
